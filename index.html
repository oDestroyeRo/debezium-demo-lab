<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=presentation/">
  <link rel="canonical" href="presentation/">
  <title>Solving the Dual Write Problem with Debezium</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f6f7fb;
      color: #17202e;
    }

    main {
      width: min(520px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid #d8deea;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgb(23 32 46 / 12%);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      line-height: 1.08;
    }

    p {
      margin: 0 0 18px;
      color: #4e5a6c;
      line-height: 1.6;
    }

    a {
      color: #0b6bcb;
      font-weight: 700;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #111827;
        color: #f7fafc;
      }

      main {
        border-color: #2f3a4d;
        background: #182235;
      }

      p {
        color: #bdc7d8;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Solving the Dual Write Problem with Debezium</h1>
    <p>The presentation now lives in the <code>presentation/</code> folder. This root page keeps GitHub Pages working from the repository root.</p>
    <a href="presentation/">Open presentation</a>
  </main>
  <script>
    window.location.replace("presentation/" + window.location.hash);
  </script>
</body>
</html>
